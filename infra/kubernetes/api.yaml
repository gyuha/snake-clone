apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: serpent-arena
  labels: { app.kubernetes.io/name: serpent-api }
spec:
  selector: { app.kubernetes.io/name: serpent-api }
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: serpent-arena
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector: { matchLabels: { app.kubernetes.io/name: serpent-api } }
  template:
    metadata: { labels: { app.kubernetes.io/name: serpent-api } }
    spec:
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: { matchLabels: { app.kubernetes.io/name: serpent-api } }
      containers:
        - name: api
          image: ghcr.io/example/serpent-api:immutable-tag
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8080 }]
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: serpent-runtime, key: database-url } }
            - name: REDIS_URL
              valueFrom: { secretKeyRef: { name: serpent-runtime, key: redis-url } }
            - name: SERPENT_TOKEN_SECRET
              valueFrom: { secretKeyRef: { name: serpent-runtime, key: token-secret } }
            - name: SERPENT_INTERNAL_SECRET
              valueFrom: { secretKeyRef: { name: serpent-runtime, key: internal-secret } }
            - name: SERPENT_ADMIN_SECRET
              valueFrom: { secretKeyRef: { name: serpent-runtime, key: admin-secret } }
            - name: SERPENT_GAME_OPS_SECRET
              valueFrom: { secretKeyRef: { name: serpent-runtime, key: game-ops-secret } }
            - name: SERPENT_GAME_OPS_ENDPOINT
              value: http://game-server:2567
          readinessProbe: { httpGet: { path: /health, port: http }, initialDelaySeconds: 3, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /health, port: http }, initialDelaySeconds: 10, periodSeconds: 10 }
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: api, namespace: serpent-arena }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: api }
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 65 } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: api, namespace: serpent-arena }
spec:
  minAvailable: 1
  selector: { matchLabels: { app.kubernetes.io/name: serpent-api } }
